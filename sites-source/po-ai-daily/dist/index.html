<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f"><title>PO AI Daily</title>
<meta name="description" content="A focused 10–15 minute daily practice for technical product owners building practical AI fluency.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307111f'/%3E%3Cpath d='M17 19h18a11 11 0 010 22H25v8h-8V19zm8 8v6h10a3 3 0 000-6H25z' fill='%234de1c1'/%3E%3C/svg%3E">
<style>
:root{--bg:#07111f;--panel:#0d1a2c;--ink:#eef6ff;--muted:#93a8bf;--line:#203652;--mint:#4de1c1;--blue:#63a9ff;--gold:#ffc857;--red:#ff7185}*{box-sizing:border-box}html{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% -10%,#143d5b 0,transparent 34rem),var(--bg)}button,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border-radius:12px;background:var(--mint);color:#07111f;font-weight:900;display:grid;place-items:center}.brand h1{font-size:1.2rem;margin:0}.brand p{font-size:.83rem;color:var(--muted);margin:2px 0 0}.streak{display:flex;gap:8px;background:#0d1a2ccc;border:1px solid var(--line);border-radius:999px;padding:9px 14px}.streak strong{color:var(--gold)}.topline{display:flex;justify-content:space-between;gap:18px;align-items:end}.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mint);font-weight:800}.topline h2{font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.07;margin:8px 0 0;max-width:720px}.timer{min-width:174px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px}.timer span{font-size:1.8rem;font-variant-numeric:tabular-nums;font-weight:800}.timer button{display:block;margin:5px auto 0;background:none;border:0;color:var(--mint)}.progress{height:8px;background:#15263c;border-radius:999px;overflow:hidden;margin:18px 0 25px}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--blue));transition:.35s}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.72fr);gap:18px}.stack{display:grid;gap:18px}.card{background:linear-gradient(145deg,#101f33ef,#0b1728ef);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 14px 50px #0003}.card h3{font-size:1.05rem;margin:0 0 14px;display:flex;gap:9px;align-items:center}.num{color:#07111f;background:var(--mint);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.78rem;font-weight:900}.card p{color:#c9d8e8;line-height:1.62}.concept{font-size:1.08rem}.example{border-left:3px solid var(--blue);padding-left:14px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.btn{border:1px solid var(--line);background:#142741;color:var(--ink);padding:10px 14px;border-radius:11px;font-weight:750}.btn:hover{border-color:var(--blue)}.btn.primary{background:var(--mint);border-color:var(--mint);color:#06131d}.btn.done{background:#163d37;color:#8ff5df;border-color:#28665b}.btn.ghost{background:transparent}.prompt{white-space:pre-wrap;background:#07111f;border:1px solid #28435f;border-radius:13px;padding:16px;color:#ddecfb;font-family:ui-monospace,monospace;font-size:.88rem;line-height:1.55}.options{display:grid;gap:9px}.option{text-align:left;border:1px solid var(--line);background:#101f33;color:var(--ink);padding:12px 14px;border-radius:12px}.option.correct{border-color:var(--mint);background:#133a34}.option.wrong{border-color:var(--red);background:#3a1c28}.feedback{min-height:25px;color:var(--muted)}textarea{width:100%;min-height:126px;resize:vertical;border:1px solid var(--line);border-radius:13px;background:#081422;color:var(--ink);padding:13px;line-height:1.5}.save-note{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.saved{color:var(--mint);font-size:.85rem;opacity:0}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:.8rem}.day.complete{background:#153b35;color:var(--mint);border-color:#28665b}.day.today{outline:2px solid var(--blue);outline-offset:2px}.mini{color:var(--muted);font-size:.86rem}.footer-actions{display:flex;gap:8px;margin-top:14px}@media(max-width:760px){.shell{padding:18px}.grid{grid-template-columns:1fr}.topline{align-items:flex-start;flex-direction:column}.timer{width:100%;display:flex;align-items:center;justify-content:space-between}.timer button{margin:0}.brand p{display:none}.card{padding:18px}}
</style></head><body><main class="shell">
<header><div class="brand"><div class="mark">PO</div><div><h1>PO AI Daily</h1><p>Sharper product judgment in 15 minutes</p></div></div><div class="streak">⚡ <strong id="streak">0 day streak</strong></div></header>
<section class="topline"><div><div class="eyebrow" id="dayLabel"></div><h2 id="title"></h2></div><div class="timer"><span id="clock">15:00</span><button id="timerBtn">Start focus timer</button></div></section><div class="progress"><div id="progress"></div></div>
<div class="grid"><div class="stack">
<section class="card"><h3><span class="num">1</span> Learn <span class="mini">· 3 min</span></h3><p class="concept" id="concept"></p><p class="example" id="example"></p><div class="actions"><button class="btn" data-step="learn">Mark learned</button></div></section>
<section class="card"><h3><span class="num">2</span> Apply <span class="mini">· 5 min</span></h3><p id="scenario"></p><div class="options" id="options"></div><p class="feedback" id="feedback"></p></section>
<section class="card"><h3><span class="num">3</span> Use the prompt <span class="mini">· 3 min</span></h3><div class="prompt" id="prompt"></div><div class="actions"><button class="btn" id="copy">Copy prompt</button><button class="btn" data-step="prompt">I used it</button></div></section>
<section class="card"><h3><span class="num">4</span> Make it yours <span class="mini">· 4 min</span></h3><p id="reflection"></p><textarea id="notes" placeholder="Write the decision, question, or improvement you will carry into your next workday…"></textarea><div class="save-note"><span class="saved" id="saved">Saved</span><button class="btn primary" id="finish">Complete today</button></div></section>
</div><aside class="stack">
<section class="card"><h3>This week</h3><div class="week" id="week"></div><p class="mini" id="weekText"></p></section>
<section class="card"><h3>Today's outcome</h3><p id="outcome"></p><p class="mini">The goal is one useful change in how you work—not passive reading.</p></section>
<section class="card"><h3>PO quick tools</h3><div class="actions"><button class="btn ghost quick" data-type="story">Story builder</button><button class="btn ghost quick" data-type="risk">Risk scan</button><button class="btn ghost quick" data-type="meeting">Meeting prep</button></div><div class="footer-actions"><button class="btn ghost" id="export">Export notes</button><button class="btn ghost" id="reset">Reset today</button></div></section>
</aside></div></main>
<script>
var lessons=[
{tag:"AI fluency",title:"Turn vague requests into testable outcomes",concept:"AI is strongest when you give it a job, context, constraints, and a definition of a good answer. Treat your prompt like a lightweight acceptance criterion—not a search box.",example:"Instead of “write user stories,” specify the user, business outcome, known rules, edge cases, and the format you need. Then ask the model to identify missing information before drafting.",scenario:"A stakeholder says: “Add AI to the member portal so customers call support less.” What is the strongest first move?",options:["Ask AI to list popular chatbot features","Clarify the support problem, affected users, baseline call drivers, risk limits, and measurable outcome","Create an epic called “AI chatbot” and estimate it"],answer:1,why:"Correct. Start with the outcome and evidence. Technology choice comes after the problem is bounded.",prompt:"Act as a skeptical product discovery partner.\n\nGoal: Reduce avoidable support calls in a member portal.\nContext: [product, users, top call drivers, current metrics]\nConstraints: [privacy, compliance, timeline, systems]\n\nAsk me the 7 highest-value questions needed before proposing a solution. Then produce: (1) problem statement, (2) assumptions to validate, (3) 3 measurable outcomes, and (4) smallest safe experiment.",reflection:"What current request or backlog item needs a clearer outcome before your team builds it?",outcome:"Leave with one outcome-focused discovery prompt you can use on a real request."},
{tag:"Backlog",title:"Use AI to challenge—not own—prioritization",concept:"AI can surface tradeoffs and inconsistencies quickly, but prioritization remains a product judgment. Feed it consistent criteria, ask for evidence gaps, and review its reasoning.",example:"Have AI score items using value, urgency, risk reduction, effort, and confidence. Then ask which rankings are fragile because the evidence is weak.",scenario:"Two executives want different items first. What input makes an AI comparison most useful?",options:["Their job titles","A consistent scoring rubric plus evidence and confidence for each item","The number of words in each request"],answer:1,why:"Exactly. Comparable criteria make tradeoffs visible without pretending the model makes the decision.",prompt:"Compare these backlog items using customer value, business value, urgency, risk reduction, effort, dependency impact, and evidence confidence. Show a transparent scorecard. Flag missing facts and fragile rankings. Do not make the final decision.\n\nItems:\n[paste items]",reflection:"Which top backlog item would move if you scored evidence confidence honestly?",outcome:"Create a defensible comparison for competing priorities."},
{tag:"Requirements",title:"Find the gaps before refinement",concept:"Use AI as a requirements critic. It is good at enumerating happy paths, alternative flows, permissions, data conditions, failure states, and nonfunctional concerns—when told not to invent facts.",example:"Paste a draft story and ask for questions grouped by user, business rule, data, integration, security, accessibility, and observability.",scenario:"A story says, “As a member, I can update my coverage.” What is the most dangerous hidden ambiguity?",options:["The button color","Which coverage changes are permitted, when they take effect, and downstream system impact","Whether the story has a short title"],answer:1,why:"Correct. Eligibility, effective dates, auditability, and integrations can fundamentally change scope.",prompt:"Review the story below as a senior BA, architect, QA lead, security reviewer, and support lead. List unanswered questions by role. Separate confirmed facts, assumptions, and risks. Identify edge cases and propose testable acceptance criteria without inventing business rules.\n\nStory:\n[paste story]",reflection:"Choose one story entering refinement. What question would be expensive to discover during development?",outcome:"Walk into refinement with sharper questions and fewer hidden assumptions."},
{tag:"Discovery",title:"Turn interviews into evidence",concept:"AI can accelerate synthesis, but it can also flatten nuance. Keep quotes and observations traceable, separate facts from interpretation, and look for contradictions—not just themes.",example:"Ask for themes with evidence counts, outliers, unresolved questions, and potential sample bias.",scenario:"Five users mention a feature. Does that prove you should build it?",options:["Yes, five requests are enough","No; examine the underlying job, frequency, alternatives, segment, and outcome","Only if an executive agrees"],answer:1,why:"Right. Feature requests are clues. The underlying problem and behavior are the evidence.",prompt:"Synthesize these interview notes. For each theme include supporting observations, segment, frequency, severity, workaround, and confidence. Preserve contradictions and outliers. Separate direct evidence from inference. End with the 5 next questions that would reduce uncertainty most.\n\nNotes:\n[paste notes]",reflection:"Where might your current discovery evidence be confusing repeated opinions with validated need?",outcome:"Convert raw feedback into traceable evidence and next questions."},
{tag:"Metrics",title:"Define success before shipping",concept:"A good product metric connects behavior to value and includes guardrails. AI can help draft a measurement tree, but you must validate data availability and causal assumptions.",example:"Pair successful self-service completion with guardrails like abandonment, repeat contact, complaints, and processing errors.",scenario:"A portal redesign increases logins by 20%. Is that automatically success?",options:["Yes, more engagement always means more value","No; logins may rise because users are confused or retrying","Yes, if the dashboard is green"],answer:1,why:"Correct. Activity is not the same as value. Pair it with task success and friction indicators.",prompt:"Create a measurement plan for this product change: [change]. Include user outcome, business outcome, leading indicators, lagging indicators, guardrails, segmentation, baseline needed, instrumentation events, and a decision rule for expand/change/stop. Flag metrics that could mislead.",reflection:"What feature are you discussing today that lacks a clear decision rule after launch?",outcome:"Define a measurable launch decision instead of merely tracking activity."}
];
var key="po-ai-daily-v1",today=new Date().toISOString().slice(0,10),idx=Math.floor(Date.now()/86400000)%lessons.length,L=lessons[idx],state=JSON.parse(localStorage.getItem(key)||'{"days":{},"notes":{}}');state.days[today]=state.days[today]||{learn:false,apply:false,prompt:false,done:false};
function q(s){return document.querySelector(s)}function save(){localStorage.setItem(key,JSON.stringify(state))}
q("#dayLabel").textContent="DAY "+(Math.floor(Date.now()/86400000)%30+1)+" · "+L.tag.toUpperCase();q("#title").textContent=L.title;q("#concept").textContent=L.concept;q("#example").textContent=L.example;q("#scenario").textContent=L.scenario;q("#prompt").textContent=L.prompt;q("#reflection").textContent=L.reflection;q("#outcome").textContent=L.outcome;q("#notes").value=state.notes[today]||"";
function render(){var s=state.days[today],count=[s.learn,s.apply,s.prompt,s.done].filter(Boolean).length;q("#progress").style.width=count*25+"%";document.querySelectorAll("[data-step]").forEach(function(b){var on=s[b.dataset.step];b.classList.toggle("done",on);b.textContent=on?"✓ Complete":b.dataset.step==="learn"?"Mark learned":"I used it"});q("#finish").textContent=s.done?"✓ Day complete":"Complete today";q("#finish").classList.toggle("done",s.done);var streak=0,d=new Date();while(state.days[d.toISOString().slice(0,10)]&&state.days[d.toISOString().slice(0,10)].done){streak++;d.setDate(d.getDate()-1)}q("#streak").textContent=streak+" day"+(streak===1?"":"s")+" streak";var w=q("#week");w.innerHTML="";var wc=0;for(var i=6;i>=0;i--){var x=new Date();x.setDate(x.getDate()-i);var ds=x.toISOString().slice(0,10),el=document.createElement("div");if(state.days[ds]&&state.days[ds].done)wc++;el.className="day"+(state.days[ds]&&state.days[ds].done?" complete":"")+(ds===today?" today":"");el.textContent=x.toLocaleDateString(undefined,{weekday:"narrow"});w.append(el)}q("#weekText").textContent=wc+" of 7 daily sessions completed"}
L.options.forEach(function(o,i){var b=document.createElement("button");b.className="option";b.textContent=o;b.dataset.i=i;q("#options").append(b)});q("#options").onclick=function(e){var b=e.target.closest(".option");if(!b)return;document.querySelectorAll(".option").forEach(function(x){x.disabled=true});var i=+b.dataset.i;b.classList.add(i===L.answer?"correct":"wrong");document.querySelectorAll(".option")[L.answer].classList.add("correct");q("#feedback").textContent=i===L.answer?L.why:"Not quite. "+L.why;state.days[today].apply=true;save();render()};
document.querySelectorAll("[data-step]").forEach(function(b){b.onclick=function(){var k=b.dataset.step;state.days[today][k]=!state.days[today][k];save();render()}});
q("#copy").onclick=async function(){await navigator.clipboard.writeText(L.prompt);this.textContent="Copied";var b=this;setTimeout(function(){b.textContent="Copy prompt"},1200)};
q("#notes").oninput=function(){state.notes[today]=this.value;save();q("#saved").style.opacity=1;clearTimeout(window.st);window.st=setTimeout(function(){q("#saved").style.opacity=0},1000)};
q("#finish").onclick=function(){state.days[today].done=!state.days[today].done;save();render()};
var quick={story:"Turn this request into one user story with testable acceptance criteria. List assumptions and unanswered questions first: [paste request]",risk:"Review this initiative across user, business, delivery, data, security, compliance, and operational risk. Rank by impact and uncertainty: [paste context]",meeting:"Prepare me for this meeting. Give me the decision needed, facts known, assumptions, 5 questions, likely objections, and a crisp opening: [paste agenda/context]"};
document.querySelectorAll(".quick").forEach(function(b){b.onclick=async function(){await navigator.clipboard.writeText(quick[b.dataset.type]);var t=b.textContent;b.textContent="Copied";setTimeout(function(){b.textContent=t},1200)}});
q("#export").onclick=function(){var text=Object.entries(state.notes).filter(function(x){return x[1]}).map(function(x){return x[0]+"\n"+x[1]}).join("\n\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download="PO-AI-Daily-notes.txt";a.click()};
q("#reset").onclick=function(){if(confirm("Reset today’s progress and note?")){delete state.days[today];delete state.notes[today];location.reload()}};
var secs=900,timer=null;q("#timerBtn").onclick=function(){var b=this;if(timer){clearInterval(timer);timer=null;b.textContent="Resume timer"}else{timer=setInterval(function(){secs--;q("#clock").textContent=String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");if(secs<=0){clearInterval(timer);timer=null;b.textContent="Time complete"}},1000);b.textContent="Pause timer"}};
if(document.modelContext&&document.modelContext.registerTool){document.modelContext.registerTool({name:"complete_daily_po_session",title:"Complete daily PO session",description:"Mark today's PO AI Daily session complete after the user has finished it.",inputSchema:{type:"object",properties:{reflection:{type:"string"}},required:["reflection"],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:function(input){if(!input||typeof input.reflection!=="string"||!input.reflection.trim())throw new Error("A reflection is required.");state.notes[today]=input.reflection.trim();state.days[today]={learn:true,apply:true,prompt:true,done:true};save();q("#notes").value=state.notes[today];render();return{date:today,status:"completed"}}})}
render();
</script></body></html>
